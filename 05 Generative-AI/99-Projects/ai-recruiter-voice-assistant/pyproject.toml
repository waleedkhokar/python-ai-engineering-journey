[project]
name = "ai-recruiter-voice-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saad", email = "mail.saad0011@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    "vapi-server-sdk>=1.11.1",
]

[project.scripts]
ai-recruiter-voice-assistant = "ai_recruiter_voice_assistant:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
