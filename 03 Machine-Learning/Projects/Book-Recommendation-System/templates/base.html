<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Reading Room{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='./style.css') }}">
</head>
<body>
  <nav class="catalog-nav">
    <div class="catalog-nav__inner">
      <a href="{{ url_for('index') }}" class="catalog-nav__brand">
        The Reading Room <span>Est. Catalog</span>
      </a>
      <div class="catalog-nav__links">
        <a href="{{ url_for('index') }}" {% if request.path == '/' %}aria-current="page"{% endif %}>Top 50</a>
        <a href="{{ url_for('recommendUi') }}" {% if request.path.startswith('/recommend') %}aria-current="page"{% endif %}>Find similar</a>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="catalog-footer">Card catalog no. 001 — books recommended by readers, for readers</footer>
</body>
</html>
